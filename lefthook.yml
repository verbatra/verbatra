pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,mjs,cjs,ts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      fail_text: |
        Biome found lint/format issues. Run `pnpm check` to see them,
        or `pnpm format` to auto-fix formatting, then re-stage.
    lockfile:
      # apps/* is inside the pnpm workspace (see pnpm-workspace.yaml), so an apps/docs dependency
      # change without a lockfile update would otherwise commit clean and only fail in CI, at
      # `pnpm install --frozen-lockfile`. Prophylactic: exactly one commit in history did this and
      # it did not turn CI red.
      #
      # e2e/ is deliberately out of scope. It sits outside the pnpm workspace and carries its own
      # e2e/package-lock.json consumed by `npm ci`, which `pnpm install --lockfile-only` cannot
      # validate. CI covers it instead.
      glob: "{package.json,packages/*/package.json,apps/*/package.json,pnpm-lock.yaml,pnpm-workspace.yaml}"
      run: pnpm install --frozen-lockfile --lockfile-only
      fail_text: |
        pnpm-lock.yaml is out of sync with a package.json (a dependency was
        added/changed/removed without updating the lockfile). Run `pnpm install`,
        then `git add pnpm-lock.yaml` and commit again.
    catalog-lockfile:
      glob: "{package.json,packages/*/package.json,apps/*/package.json,pnpm-lock.yaml,pnpm-workspace.yaml}"
      run: pnpm check:catalog-lockfile
      fail_text: |
        A catalog: specifier in pnpm-lock.yaml disagrees with its package.json.
        Restore the lockfile specifier, or run `pnpm install`, then
        `git add pnpm-lock.yaml` and commit again.
    no-em-dash:
      run: pnpm check:no-em-dash
      fail_text: |
        The em dash character (U+2014) is banned everywhere in the repo.
        Replace each flagged occurrence with a spaced hyphen, a colon, or
        parentheses, then re-stage.

commit-msg:
  commands:
    lint:
      run: pnpm commitlint --edit {1}
      fail_text: |
        Commit message must follow Conventional Commits, e.g.
        `feat(ai-providers): add Gemini provider` or `fix: correct hashing`.
        See https://www.conventionalcommits.org.
