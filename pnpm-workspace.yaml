packages:
  - "packages/*"
  - "apps/*"

# Single-source duplicated versions. Default catalog holds the shared toolchain, zod, chokidar
# (shared between @verbatra/sdk and @verbatra/studio), and the React runtime (react, react-dom,
# @types/react, @types/react-dom, shared between @verbatra/studio and apps/docs); the "bundled"
# catalog holds the runtime deps that @verbatra/sdk re-declares from the internal packages it
# bundles, so the owning package and sdk always pin the same version.
#
# Dependabot maintains the versions below, in both "catalog" and "catalogs.bundled" (see the
# comment in .github/dependabot.yml). This was previously documented as an upstream gap that
# required bumping every entry by hand; that is no longer accurate, so do not do it, because a
# manual bump only conflicts with the open proposal. Reach for a manual bump only when a
# security fix cannot wait for the weekly schedule.
#
# One entry is deliberately pinned back: typescript stays on the 6.x line because TypeScript 7
# is the native port and drops the JavaScript compiler API that tsup's bundled rollup-plugin-dts
# needs to emit declarations. .github/dependabot.yml ignores it and records the full reasoning.
#
# The "catalogs.bundled" entries carry the most weight, since @verbatra/sdk re-declares them and
# they ship to consumers rather than staying internal to this repo. Treat every version below as
# part of the published contract: a change here lands in a consumer's node_modules, lockfile,
# npm audit and SBOM, so it belongs in the changelog. Four of them moved into 0.6.3 with no
# changeset, one across a major, which is why scripts/check-dependency-changeset.mjs now fails a
# pull request that moves any of them without one. Dependabot no longer proposes majors for these
# entries either; taking one is a deliberate act that verifies the affected seam first.
catalog:
  "@types/node": 26.6.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.0.3
  ajv: 8.20.0
  chokidar: 5.0.0
  knip: 6.39.0
  parse5: 8.0.1
  playwright: 1.63.0
  react: 19.3.0
  react-dom: 19.3.0
  tsup: 8.5.1
  typescript: 6.0.3
  vitest: 5.0.3
  zod: 4.6.5

catalogs:
  bundled:
    "@anthropic-ai/sdk": 0.131.0
    "@formatjs/icu-messageformat-parser": 3.5.21
    "@google/genai": 2.27.0
    "@xmldom/xmldom": 0.9.12
    deepl-node: 1.28.0
    exceljs: 4.4.0
    jszip: 3.10.2
    loglevel: 1.9.2
    openai: 7.28.0
    yaml: 2.9.1

overrides:
  # Force the patched postcss for the vulnerable copies only (next bundles 8.4.31).
  # GHSA-qx2v-qp2m-jg93 (XSS via unescaped </style> in CSS stringify output, <8.5.10) and
  # GHSA-r28c-9q8g-f849 (path traversal in source map auto-loading disclosing arbitrary .map
  # files, <=8.5.17). Dev-only paths (tailwind, vite, and next tooling). The <9 ceiling keeps the
  # lift inside the v8 line those consumers declare, so a future major is never resolved onto them.
  postcss@<8.5.18: ">=8.5.18 <9"
  # GHSA-w5hq-g745-h8pq: missing buffer bounds check in uuid v3/v5/v6 with a buf argument.
  # Vulnerable <11.1.1; lifts the copy exceljs pulls (uuid 8.3.2) on the published sdk/exchange path.
  uuid@<11.1.1: ">=11.1.1"
  # GHSA-h67p-54hq-rp68: quadratic-complexity DoS in js-yaml merge-key handling (dev-only, via @changesets/cli).
  # Vulnerable <3.15.0; lifts the v3 copy (3.14.2) to the patched v3 line (3.15.0). The upper bound is
  # required: read-yaml-file@1.1.0 (used by changesets) calls the v3-only yaml.safeLoad, so an unbounded
  # ">=3.15.0" would resolve v4/v5 and break `changeset version`.
  js-yaml@<3.15.0: ">=3.15.0 <4"
  # GHSA-g7r4-m6w7-qqqr: esbuild dev-server arbitrary file read on Windows (dev-only, via vitest and tsup).
  # Vulnerable >=0.27.3 <0.28.1; lifts the 0.27.7 copy.
  esbuild@<0.28.1: ">=0.28.1"
  # GHSA-xcpc-8h2w-3j85 (CVE-2026-39244, a crafted ZIP uncompressed-size header forces a ~4GB
  # allocation) plus GHSA-vwc7-r8mq-g2x9 (extraction follows destination symlinks, allowing
  # arbitrary file overwrite), which extends the vulnerable range through 0.6.0 and so makes the
  # 0.6.0 this override used to pin vulnerable in its own right. Lifts the 0.5.17 copy adm-zip is
  # pulled through (deepl-node) to the patched line.
  adm-zip@<0.6.1: ">=0.6.1"
  # GHSA-gcfj-64vw-6mp9 (high, Node adapter reuses an inherited proxy across cloned configs) plus the
  # axios moderate cluster (GHSA-mwf2-3pr3-8698, GHSA-f4gw-2p7v-4548, GHSA-hcpx-6fm6-wx23,
  # GHSA-xj6q-8x83-jv6g and the rest of the 1.15.2-1.17.x line). All patched in 1.18.0; lifts the
  # 1.17.0 copy deepl-node pulls on the published ai-providers/sdk path. The 1.19.0 floor this override
  # used to resolve is vulnerable in its own right: GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8,
  # GHSA-c29m-xwm3-cm6r, GHSA-m8m8-qj5v-23w3, GHSA-mghh-pgcx-3jjj, GHSA-r4gj-5m52-g5wh and
  # GHSA-x97p-jq2g-jp4f (high: HTTP/2 proxy and DNS bypass, HTTP/2 DoS, data: URL and NO_PROXY ReDoS,
  # prototype-pollution gadgets, maxRedirects: 0 ignored by the fetch adapter) plus the moderate
  # GHSA-44g4-m2mj-wpvx, GHSA-4hqw-qxg8-jxx2, GHSA-9fr6-4gfg-395g, GHSA-j8rh-479h-cp32 and
  # GHSA-vh66-26gq-q6x8 all extend the vulnerable range to <1.20.0. deepl-node declares axios ^1.7.4,
  # so the <2 ceiling keeps it inside 1.x.
  axios@<1.20.0: ">=1.20.0 <2"
  # GHSA-j3f2-48v5-ccww: protobufjs DoS via an infinite loop parsing a crafted descriptor.
  # Vulnerable >=7.5.0 <=7.6.4; lifts the 7.6.4 copy @google/genai pulls on the published sdk path.
  # The <8 ceiling is required: @google/genai declares protobufjs ^7.5.4, so an unbounded ">=7.6.5"
  # would resolve the 8.x major (8.7.1) and break it.
  protobufjs@<7.6.5: ">=7.6.5 <8"
  # GHSA-52cp-r559-cp3m (high): quadratic-complexity DoS in js-yaml merge-key handling on the v4 line,
  # vulnerable >=4.0.0 <4.3.0. GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 (high): quadratic CPU consumption
  # in !!omap resolution, which extends the vulnerable range to >=4.0.0 <4.3.1 and so makes the 4.3.0
  # this override used to pin vulnerable in its own right. GHSA-2883-xcg3-v3hh (high): maxTotalMergeKeys
  # does not limit CPU use for empty merge sources, which extends the vulnerable range to >=4.0.0
  # <4.3.2 and so makes the 4.3.1 this override used to pin vulnerable in its own right. Lifts the
  # copy on the published sdk path (via cosmiconfig config loading), and in @commitlint/cli (dev)
  # and fumadocs-mdx (docs). The <5 ceiling keeps it on the v4 API those consumers expect.
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  # GHSA-724g-mxrg-4qvm (quadratic-complexity DoS via a crafted !!omap, <=5.2.0) and
  # GHSA-pm4m-ph32-ghv5 (exponential parsing time in flow collections, <=5.2.1) on the v5 line.
  # Lifts the copy fumadocs-core pulls (apps/docs, private) to the patched release.
  "js-yaml@>=5.0.0 <5.2.2": ">=5.2.2 <6"
  # GHSA-3jxr-9vmj-r5cp (ReDoS via exponential-time expansion) and GHSA-mh99-v99m-4gvg (DoS via
  # unbounded expansion length causing an out-of-memory crash, patched in 1.1.17 and 2.1.3). Both
  # vulnerable majors reach the published sdk/exchange path through exceljs>archiver>...>minimatch.
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (high, stack exhaustion through uncontrolled
  # recursion) and GHSA-q2hr-2g5m-vwhr (moderate, quadratic-time `{a},b}` rewrite) extend the
  # vulnerable ranges to <1.1.21 and >=2.0.0 <2.1.7, so the 1.1.17 and 2.1.3 floors this override used
  # to set are vulnerable in their own right. Lift each to its patched release, bounded to its own major.
  brace-expansion@<1.1.21: ">=1.1.21 <2"
  "brace-expansion@>=2.0.0 <2.1.7": ">=2.1.7 <3"
  # GHSA-v2hh-gcrm-f6hx (high): fast-uri host confusion via a literal backslash as the authority
  # delimiter, vulnerable >=3.0.0 <=3.1.3. GHSA-qw65-cvwx-89v3 (high) extends the vulnerable range to
  # >=3.0.0 <3.1.7 and GHSA-58mr-gqgx-xq4g (high) names 3.1.6 itself, so the 3.1.4 floor this override
  # used to set is vulnerable in its own right. Lifts the copies ajv pulls through commitlint (dev-only)
  # and through @google/genai > @modelcontextprotocol/sdk (published sdk path), bounded to the v3 line
  # ajv expects.
  "fast-uri@>=3.0.0 <3.1.7": ">=3.1.7 <4"
  # GHSA-hxh3-vqpv-xpqv: hono/jsx renders plain strings unescaped in boundary components (XSS).
  # Vulnerable <4.13.7; lifts the 4.13.5 copy @hono/node-server pulls through
  # @google/genai > @modelcontextprotocol/sdk on the published sdk path. The <5 ceiling matches the
  # hono ^4 peer range @hono/node-server declares.
  hono@<4.13.7: ">=4.13.7 <5"
  # GHSA-h3mg-xc3c-68pw (Address6 builds an unbounded parse diagnostic, stalling or crashing the
  # process) and GHSA-j6r3-76f7-8jcv (isInSubnet compares addresses of different families, admitting
  # an address outside an allowlist). Vulnerable <=10.7.0; lifts the copy express-rate-limit pulls
  # through @google/genai > @modelcontextprotocol/sdk on the published sdk path, bounded to the v10 line.
  ip-address@<10.7.1: ">=10.7.1 <11"
  # GHSA-f88m-g3jw-g9cj (high): sharp inherits libvips vulnerabilities. Vulnerable <0.35.0; lifts the
  # copy next pulls for image optimization (apps/docs only, private, not published to npm).
  sharp@<0.35.0: ">=0.35.0"
  # Next.js highs patched in 16.2.11: App Router middleware/proxy bypass, App Router DoS, Server
  # Actions SSRF, and rewrites SSRF (all >=16.0.0 <16.2.11, apps/docs only, private). The direct pin in
  # apps/docs/package.json is at or above 16.2.11; this override lifts any transitive fumadocs copy too,
  # bounded to the 16 major so a patched minor like 16.3 still satisfies the peer ranges it rewrites.
  "next@>=16.0.0 <16.2.11": ">=16.2.11 <17"
  # GHSA-2v37-7h3g-55p8 (CVE-2026-67213, high): customAlphabet and customRandom loop forever when
  # called with a size of 0, hanging the calling thread. Vulnerable <3.3.17 on the v3 line; lifts the
  # 3.3.16 copy postcss pulls (dev-only, via tsup and @tailwindcss/postcss) to the patched release.
  # The tree already resolves 3.3.18 for the other postcss copies, so this only dedupes onto it. The
  # <4 ceiling keeps it on the v3 API postcss declares, since v4 dropped the CommonJS entry point.
  nanoid@<3.3.17: ">=3.3.17 <4"
  # GHSA-jqcg-44mw-7w3h (critical): proxy-addr IP spoofing via an IPv4-mapped IPv6 trust subnet.
  # Vulnerable >=1.1.0 <2.0.8; lifts the 2.0.7 copy express pulls through
  # @google/genai > @modelcontextprotocol/sdk on the published sdk path. The <3 ceiling matches the
  # ^2.0.7 range express declares.
  proxy-addr@<2.0.8: ">=2.0.8 <3"
  # GHSA-68fv-2mgg-jv7q (high): source-map-js event-loop DoS through indexed source-map section
  # offsets. Vulnerable >=1.0.0 <1.2.2; lifts the 1.2.1 copy postcss, tailwind and css-tree pull
  # (dev-only, and next in apps/docs), bounded to the v1 line they declare.
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2 <2"
  # GHSA-r4xh-jqrq-34v2 (moderate): smol-toml quadratic-time parse() from parseKey rescanning to the
  # end of the document on each key line. Vulnerable <=1.8.0, and 1.9.0 is the first release after it;
  # lifts the 1.8.0 copy knip pulls (dev-only), bounded to the v1 line knip declares.
  smol-toml@<1.9.0: ">=1.9.0 <2"
  # GHSA-pqg4-j6r4-53mv (critical): shell-quote quote() command injection via a line terminator in a
  # token after a { comment } token. Vulnerable >=1.8.4 <1.11.0; lifts the 1.10.0 copy launch-editor
  # pulls through @changesets/cli (dev-only), bounded to the v1 line launch-editor declares.
  shell-quote@<1.11.0: ">=1.11.0 <2"

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  # Deliberately denied. Playwright's postinstall downloads a browser bundle (hundreds of MB),
  # and nothing on the install path needs one: it is used only by the docs screenshot harness
  # (apps/docs/scripts/capture-studio.mjs), which a maintainer runs by hand after
  # `pnpm --filter @verbatra/docs exec playwright install chromium`. Denying the build keeps
  # `pnpm install` and every CI job free of the download. See CONTRIBUTING.md.
  playwright: false
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  - adm-zip@0.6.1
