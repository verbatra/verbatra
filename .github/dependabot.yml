version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@formatjs/icu-messageformat-parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@google/genai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@xmldom/xmldom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "deepl-node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "exceljs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jszip"
        update-types: ["version-update:semver-major"]
      - dependency-name: "loglevel"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "yaml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cosmiconfig"
        update-types: ["version-update:semver-major"]
    groups:
      deepl-logging:
        patterns:
          - "deepl-node"
          - "loglevel"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
