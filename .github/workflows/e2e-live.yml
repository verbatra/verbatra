name: E2E (live)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-live:
    name: Drive the CLI against a live provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.14.0"

      - name: Build
        run: pnpm build

      - name: Pack the published tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/sdk pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/cli pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/studio pack --pack-destination "$RUNNER_TEMP/packs"
          echo "VERBATRA_SDK_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-sdk-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_CLI_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-cli-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_STUDIO_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-studio-*.tgz)" >> "$GITHUB_ENV"

      - name: Install e2e harness dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Typecheck e2e harness
        working-directory: e2e
        run: npm run typecheck

      - name: Run full E2E suite (no-key and live)
        id: suite
        working-directory: e2e
        run: npm test
        env:
          E2E_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Report what this tier's result means
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          {
            echo "## E2E (live)"
            echo
            echo "Result: \`${SUITE_OUTCOME:-not reached, an earlier step failed}\`."
            echo
            echo "This tier is advisory and never gates a publish. The required release gate is the"
            echo "deterministic no-key tier, reported as \"Build and test gate\" on the CI workflow."
            echo
            echo "A provider rate limit is reported as a skipped test, not a failure, so a failure"
            echo "here means the CLI is genuinely broken against a real provider."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUITE_OUTCOME" = "failure" ]; then
            echo "::warning title=Live E2E failed::The CLI failed against a real provider for a reason other than throttling. Investigate before the next release."
          fi
