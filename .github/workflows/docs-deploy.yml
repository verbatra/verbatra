name: Deploy Docs

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PROJECT_DIR: ~/verbatra

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        run: |
          IMAGE_PATH="${{ env.REGISTRY }}/${{ github.repository }}-docs"
          echo "tag=$(echo "$IMAGE_PATH" | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Copy docker-compose.yml
        uses: ./.github/actions/ssh-copy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./docker-compose.yml
          target: ${{ env.PROJECT_DIR }}

      - name: Deploy on VPS
        uses: ./.github/actions/ssh-connect
        env:
          ARCJET_KEY: ${{ secrets.ARCJET_KEY }}
          CONTACT_SMTP_HOST: ${{ secrets.CONTACT_SMTP_HOST }}
          CONTACT_SMTP_PORT: ${{ secrets.CONTACT_SMTP_PORT }}
          CONTACT_SMTP_USER: ${{ secrets.CONTACT_SMTP_USER }}
          CONTACT_SMTP_PASSWORD: ${{ secrets.CONTACT_SMTP_PASSWORD }}
          CONTACT_SMTP_FROM: ${{ secrets.CONTACT_SMTP_FROM }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ARCJET_KEY,CONTACT_SMTP_HOST,CONTACT_SMTP_PORT,CONTACT_SMTP_USER,CONTACT_SMTP_PASSWORD,CONTACT_SMTP_FROM
          script: |
            set -e
            cd ${{ env.PROJECT_DIR }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
