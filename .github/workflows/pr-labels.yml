name: PR labels

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by path and title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - name: Label by Conventional Commit type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const types = {
              feat: "type: feature",
              fix: "type: bug",
              docs: "type: docs",
              perf: "type: performance",
            };
            const managed = [...new Set(Object.values(types)), "type: maintenance", "breaking change"];
            const match = /^(\w+)(\([^)]*\))?(!)?:/.exec(pullRequest.title);
            const desired = new Set();
            if (match) {
              desired.add(types[match[1]] ?? "type: maintenance");
              if (match[3]) desired.add("breaking change");
            }
            const current = new Set((pullRequest.labels ?? []).map((label) => label.name));
            for (const name of managed) {
              if (current.has(name) && !desired.has(name)) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: pullRequest.number,
                    name,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            const missing = [...desired].filter((name) => !current.has(name));
            if (missing.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pullRequest.number,
                labels: missing,
              });
            }
