name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}

      - name: Guard against em dash (U+2014)
        run: pnpm check:no-em-dash

      - name: Check (lint and format)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Guard published declarations (self-contained .d.ts)
        run: pnpm check:dts

      - name: Guard the studio command's bundling (dynamic import, no inlined @verbatra/studio)
        run: pnpm check:studio-bundle

      - name: Guard the emitted config JSON Schema
        run: pnpm check:config-schema

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Typecheck build config files
        run: pnpm typecheck:configs

      - name: Test
        run: pnpm test

      - name: Test root scripts
        run: pnpm test:scripts

      - name: Upload coverage artifact
        if: ${{ matrix.node == '22.14.0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: packages/*/coverage/lcov.info
          retention-days: 5

  codecov-upload:
    name: Upload coverage to Codecov
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: coverage-artifacts

      - name: Guard against a silently empty coverage upload
        run: |
          shopt -s nullglob
          files=(coverage-artifacts/*/coverage/lcov.info)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No lcov.info files found under coverage-artifacts/*/coverage/. Codecov would upload nothing." >&2
            find coverage-artifacts -type f >&2
            exit 1
          fi
          echo "Found ${#files[@]} lcov.info file(s):"
          printf '%s\n' "${files[@]}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage-artifacts/*/coverage/lcov.info

  dependency-disclosure:
    name: Dependency disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Guard published dependency changes against a missing changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/check-dependency-changeset.mjs

  e2e:
    name: Install tarballs and drive the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.14.0"

      - name: Build
        run: pnpm build

      - name: Pack the published tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/sdk pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/cli pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter @verbatra/studio pack --pack-destination "$RUNNER_TEMP/packs"
          echo "VERBATRA_SDK_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-sdk-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_CLI_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-cli-*.tgz)" >> "$GITHUB_ENV"
          echo "VERBATRA_STUDIO_TARBALL=$(ls "$RUNNER_TEMP"/packs/verbatra-studio-*.tgz)" >> "$GITHUB_ENV"

      - name: Install e2e harness dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Typecheck e2e harness
        working-directory: e2e
        run: npm run typecheck

      - name: Run no-key E2E suite
        working-directory: e2e
        run: npm run test:nokey

  docs-image:
    name: Build the docs Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the docs image is in scope for this event
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request; docs-deploy.yml builds this image on main."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            apps/docs packages pnpm-lock.yaml .github/workflows/ci.yml)
          if [ -z "$changed" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change under apps/docs, packages, pnpm-lock.yaml or this workflow."
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "In-scope changes:"
          printf '%s\n' "$changed"

      - name: Set up Docker Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the docs image
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    name: Build and test gate
    needs: [build-and-test, e2e, dependency-disclosure, codecov-upload, docs-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    steps:
      - name: Verify every required job succeeded
        env:
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          E2E: ${{ needs.e2e.result }}
          DEPENDENCY_DISCLOSURE: ${{ needs.dependency-disclosure.result }}
          CODECOV_UPLOAD: ${{ needs.codecov-upload.result }}
          DOCS_IMAGE: ${{ needs.docs-image.result }}
        run: |
          failed=0
          for entry in "build-and-test:$BUILD_AND_TEST" \
                       "e2e:$E2E" \
                       "dependency-disclosure:$DEPENDENCY_DISCLOSURE" \
                       "codecov-upload:$CODECOV_UPLOAD" \
                       "docs-image:$DOCS_IMAGE"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            if [ "$result" != "success" ]; then
              echo "$job did not succeed: $result"
              failed=1
            fi
          done
          exit "$failed"
