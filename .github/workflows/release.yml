name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.14.0"

      - name: Build
        run: pnpm turbo run build --filter=@verbatra/sdk --filter=@verbatra/cli --filter=@verbatra/studio --filter=@verbatra/mcp

  publish:
    name: Version or publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: pnpm turbo run build --filter=@verbatra/sdk --filter=@verbatra/cli --filter=@verbatra/studio --filter=@verbatra/mcp

      - name: Create Version Packages PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm exec changeset publish
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"

  verify-publish:
    name: Verify published packages reached npm
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: ${{ needs.publish.outputs.published == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Verify published packages reached npm
        run: node scripts/verify-npm-publish.mjs
        env:
          PUBLISHED_PACKAGES_JSON: ${{ needs.publish.outputs.publishedPackages }}

  publish-mcp-registry:
    name: Publish @verbatra/mcp to the MCP Registry
    needs: [publish, verify-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.publish.outputs.published == 'true' && contains(fromJSON(needs.publish.outputs.publishedPackages).*.name, '@verbatra/mcp') && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Check server.json matches the published package
        run: node scripts/mcp-server-json.mjs check
        env:
          PUBLISHED_PACKAGES_JSON: ${{ needs.publish.outputs.publishedPackages }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

      - name: Authenticate to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish server.json to the MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish packages/mcp/server.json'

  dispatch-skills-parity:
    name: Ask verbatra/skills to re-run its tool parity
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Check the dispatch app credentials
        env:
          SKILLS_DISPATCH_APP_CLIENT_ID: ${{ secrets.SKILLS_DISPATCH_APP_CLIENT_ID }}
          SKILLS_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.SKILLS_DISPATCH_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$SKILLS_DISPATCH_APP_CLIENT_ID" ] || missing="$missing SKILLS_DISPATCH_APP_CLIENT_ID"
          [ -n "$SKILLS_DISPATCH_APP_PRIVATE_KEY" ] || missing="$missing SKILLS_DISPATCH_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Skills dispatch not configured::Missing repository secret(s):${missing}. See CONTRIBUTING.md, Dispatching the skills parity check."
            exit 1
          fi

      - name: Create a token scoped to verbatra/skills
        id: skills-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SKILLS_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_DISPATCH_APP_PRIVATE_KEY }}
          owner: verbatra
          repositories: skills
          permission-contents: write

      - name: Send source-changed to verbatra/skills
        env:
          GH_TOKEN: ${{ steps.skills-token.outputs.token }}
          SOURCE_REF: ${{ github.event.workflow_run.head_sha }}
        run: |
          jq -n --arg source_ref "$SOURCE_REF" '{event_type: "source-changed", client_payload: {source_ref: $source_ref}}' \
            | gh api --method POST repos/verbatra/skills/dispatches --input -
