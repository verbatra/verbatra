name: Bug report
description: Report something that is not working as expected in verbatra.
labels: ["type: bug", "needs triage"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in what you can; these fields are what we need to triage and reproduce it.

  - type: input
    id: version
    attributes:
      label: verbatra version
      description: The `@verbatra/sdk` / `@verbatra/cli` version (and the `@verbatra/studio` or `@verbatra/mcp` version if relevant). Run `verbatra --version`.
      placeholder: "@verbatra/cli 0.12.0"
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last version that worked
      description: If this worked in an earlier version, which one. Leave empty if it never worked or you have not tried.
      placeholder: "@verbatra/cli 0.11.2"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.22.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Format adapter (if relevant)
      description: Which source format is involved, if any.
      options:
        - Not applicable
        - i18next-json
        - vue-i18n-json
        - next-intl-json
        - ngx-translate-json
        - xliff
        - yaml
        - arb
        - properties
        - apple-strings
        - apple-xcstrings
        - android-xml
        - gettext-po
        - ini
        - resx
        - A custom third-party adapter (custom:...)
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Translation provider (if relevant)
      description: Which provider is involved, if any.
      options:
        - Not applicable
        - anthropic
        - openai
        - gemini
        - deepl
        - google-translate
        - opencode
        - openai-compatible
        - libretranslate
        - none
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A link to a public repository that reproduces the problem, or your `verbatra.config` file, one source locale file, and the exact command you ran. Without a reproduction the issue is labelled `needs reproduction` and closes after 21 days.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant CLI output. Redact API keys and other secrets before posting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: doctor
    attributes:
      label: "`npx @verbatra/cli doctor` output"
      description: Optional. Run it in the project root and paste the output. It checks your config, files, and provider setup in one go.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys and other secrets from any logs or config pasted above.
          required: true
