name: New format
description: Request support for a new i18n file format.
labels: ["type: feature", "scope: formats", "needs triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        A built-in format is an adapter in `@verbatra/format-adapters`. If you only need it for your own project, a custom adapter (`custom:...`) may already get you there: see the custom format adapters guide in the docs.

  - type: input
    id: name
    attributes:
      label: Format name
      placeholder: e.g. Fluent FTL, TOML, Qt .ts
    validations:
      required: true

  - type: input
    id: docs-link
    attributes:
      label: Official documentation or spec link
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this matters
      description: Who needs this and what ecosystem it serves.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: A small example file, including plurals or placeholders if the format has them.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this.
          required: false
