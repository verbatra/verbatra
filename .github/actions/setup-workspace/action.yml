name: Setup workspace
description: Set up Node, activate the pinned pnpm version, restore the pnpm store cache, and install dependencies with a frozen lockfile.

inputs:
  node-version:
    description: Node version passed through to actions/setup-node.
    required: true
  registry-url:
    description: Registry URL passed through to actions/setup-node.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Enable corepack and activate pnpm
      shell: bash
      run: corepack enable && corepack prepare pnpm@11.6.0 --activate

    - name: Compute pnpm store path
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
