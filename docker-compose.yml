services:
  docs:
    image: ghcr.io/verbatra/verbatra-docs:latest
    container_name: verbatra_docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - ARCJET_KEY=${ARCJET_KEY}
      - CONTACT_SMTP_HOST=${CONTACT_SMTP_HOST}
      - CONTACT_SMTP_PORT=${CONTACT_SMTP_PORT}
      - CONTACT_SMTP_USER=${CONTACT_SMTP_USER}
      - CONTACT_SMTP_PASSWORD=${CONTACT_SMTP_PASSWORD}
      - CONTACT_SMTP_FROM=${CONTACT_SMTP_FROM}
